{% extends 'base.html' %}{% block content %}<main class="wrap page"><small>SEARCH RECORDS</small><h1>Find an item.</h1><form class="search" method="get"><input name="q" value="{{q}}" placeholder="Item, description or category"><select name="item_type"><option value="">All</option><option value="lost">Lost</option><option value="found">Found</option></select><select name="category"><option value="">Any category</option>{% for x in ['Electronics','Wallet','Bag','ID Card','Keys','Bottle','Clothing','Books','Accessories','Other'] %}<option>{{x}}</option>{% endfor %}</select><input name="location" value="{{location}}" placeholder="Location"><button class="btn primary">Search</button></form><div class="cards">{% for i in items %}<a class="card" href="/item/{{i.id}}"><div class="pic {{i.item_type}}"><b>{{i.item_type|upper}}</b><strong>{{'⌁' if i.item_type=='lost' else '✓'}}</strong></div><div><small>{{i.category}}</small><h3>{{i.title}}</h3><p>📍 {{i.location}} · {{i.event_date}}</p></div></a>{% else %}<div class="empty">No matching reports.</div>{% endfor %}</div></main>{% endblock %}
