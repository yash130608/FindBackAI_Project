{% extends 'base.html' %}{% block content %}<main class="wrap page"><small>REPORT</small><h1>Tell us what happened.</h1><p class="muted">Better details help AI matching.</p><form class="form" method="post" enctype="multipart/form-data"><div class="toggle"><label><input type="radio" name="item_type" value="lost" checked><span>🔎 I lost something</span></label><label><input type="radio" name="item_type" value="found"><span>🤝 I found something</span></label></div><div class="grid2"><label>Item title<input name="title" required></label><label>Category<select name="category">{% for x in ['Electronics','Wallet','Bag','ID Card','Keys','Bottle','Clothing','Books','Accessories','Other'] %}<option>{{x}}</option>{% endfor %}</select></label><label>Location<input name="location" required></label><label>Date<input type="date" name="event_date" required></label><label>Time<input type="time" name="event_time"></label><label>Photo<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></label></div><label>Description<textarea name="description" rows="5"></textarea></label><div class="tip">🔒 Do not enter passwords, bank details or other sensitive information.</div><button class="btn primary">Submit report →</button></form></main>{% endblock %}
